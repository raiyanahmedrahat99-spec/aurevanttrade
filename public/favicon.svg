<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .primary-stroke { stroke: #141414; }
    @media (prefers-color-scheme: dark) {
      .primary-stroke { stroke: #F7F6F2; }
    }
  </style>
  <!-- Outer Geometric Diamond / Architectural Crest -->
  <polygon
    points="50,6 92,50 50,94 8,50"
    stroke="#C5A880"
    stroke-width="3.5"
    stroke-linejoin="miter"
    fill="none"
  />
  
  <!-- Inner Precision Structural Diamond -->
  <polygon
    points="50,14 84,50 50,86 16,50"
    class="primary-stroke"
    stroke-width="1.5"
    stroke-opacity="0.4"
    fill="none"
  />

  <!-- Modern Architectural Monogram "A" -->
  <!-- Left Apex Strut -->
  <path
    d="M50 20 L28 76"
    class="primary-stroke"
    stroke-width="5"
    stroke-linecap="square"
  />

  <!-- Right Apex Strut -->
  <path
    d="M50 20 L72 76"
    stroke="#C5A880"
    stroke-width="5"
    stroke-linecap="square"
  />

  <!-- Transverse Crossbeam (Horizontal Gold Bar) -->
  <line
    x1="36"
    y1="56"
    x2="64"
    y2="56"
    stroke="#DFCAA7"
    stroke-width="3.5"
  />

  <!-- Central Spire Pinnacle Dot -->
  <circle cx="50" cy="38" r="3" fill="#C5A880" />

  <!-- Bottom Foundation Keystone -->
  <line
    x1="44"
    y1="82"
    x2="56"
    y2="82"
    stroke="#C5A880"
    stroke-width="2"
  />
</svg>
